<style>
  :root{
    --paper:#faf7f0; --paper-2:#f2ede2; --grid-line: rgba(64,84,120,0.10);
    --ink:#20242c; --ink-soft:#5c6472; --card:#ffffff; --card-edge: rgba(32,36,44,0.10);
    --accent:#dd5f2a; --accent-ink:#ffffff; --accent-soft:#fde6d8;
    --good:#2f9e6e; --good-soft:#e1f5ec;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#15181f; --paper-2:#1b1f27; --grid-line: rgba(140,160,200,0.09);
      --ink:#e9ebf0; --ink-soft:#9aa1ae; --card:#1e222b; --card-edge: rgba(255,255,255,0.08);
      --accent:#f07a44; --accent-ink:#1a1006; --accent-soft:#3a2418;
      --good:#4fc98d; --good-soft:#173226;
    }
  }
  :root[data-theme="dark"]{
    --paper:#15181f; --paper-2:#1b1f27; --grid-line: rgba(140,160,200,0.09);
    --ink:#e9ebf0; --ink-soft:#9aa1ae; --card:#1e222b; --card-edge: rgba(255,255,255,0.08);
    --accent:#f07a44; --accent-ink:#1a1006; --accent-soft:#3a2418;
    --good:#4fc98d; --good-soft:#173226;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px, var(--paper);
    color:var(--ink); font-family:var(--sans); min-height:100vh;
  }
  .wrap{ max-width:620px; margin:0 auto; padding:32px 16px 60px; }
  .hero{ text-align:center; padding: 6px 0 32px; }
  .hero .eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .hero h1{ font-size:clamp(28px,7vw,36px); margin:8px 0 10px; font-weight:800; text-wrap:balance; }
  .hero p{ color:var(--ink-soft); font-size:14.5px; max-width:44ch; margin:0 auto; line-height:1.55; }

  .subject-grid{ display:flex; flex-direction:column; gap:10px; }
  .subject{ display:flex; align-items:center; gap:14px; width:100%; background:var(--card); border:1px solid var(--card-edge); border-radius:14px; padding:16px; text-decoration:none; color:var(--ink); }
  a.subject:active{ transform:scale(0.99); }
  .subject.disabled{ opacity:.55; }
  .subject .s-icon{ font-size:26px; width:50px; height:50px; border-radius:12px; background:var(--paper-2); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .subject.ready .s-icon{ background:var(--accent-soft); }
  .subject .s-body{ flex:1; min-width:0; }
  .subject .s-title{ font-weight:800; font-size:15.5px; }
  .subject .s-desc{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4; }
  .subject .s-badge{ font-family:var(--mono); font-size:10px; font-weight:700; padding:4px 9px; border-radius:6px; flex-shrink:0; }
  .subject .s-badge.ready{ background:var(--good-soft); color:var(--good); }
  .subject .s-badge.soon{ background:var(--paper-2); color:var(--ink-soft); }

  .footnote{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin: 34px 0 0; line-height:1.6; max-width:40ch; margin-left:auto; margin-right:auto; }

  .progress-card{ background:var(--card); border:1px solid var(--card-edge); border-radius:16px; padding:20px; margin-bottom:22px; }
  .progress-card[hidden]{ display:none; }
  .progress-head{ display:flex; align-items:center; gap:16px; margin-bottom:16px; }
  .progress-ring{ position:relative; width:64px; height:64px; flex-shrink:0; }
  .progress-ring svg{ transform:rotate(-90deg); }
  .progress-ring .track{ fill:none; stroke:var(--paper-2); stroke-width:8; }
  .progress-ring .fill{ fill:none; stroke:var(--accent); stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .5s; }
  .progress-ring .pct{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:800; font-size:15px; }
  .progress-title{ font-weight:800; font-size:15px; }
  .progress-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; font-family:var(--mono); }
  .progress-rows{ display:flex; flex-direction:column; gap:9px; }
  .progress-row{ display:flex; align-items:center; gap:10px; }
  .progress-row .pr-icon{ font-size:15px; width:22px; text-align:center; flex-shrink:0; }
  .progress-row .pr-name{ font-size:12.5px; font-weight:600; width:88px; flex-shrink:0; }
  .progress-row .pr-bar{ flex:1; height:8px; background:var(--paper-2); border-radius:5px; overflow:hidden; }
  .progress-row .pr-fill{ height:100%; background:var(--accent); border-radius:5px; }
  .progress-row .pr-val{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); width:52px; text-align:right; flex-shrink:0; }
</style>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Szkoła podstawowa &middot; klasa 5</div>
    <h1>Nauka — Klasa 5</h1>
    <p>Jedno miejsce na naukę i testy ze wszystkich przedmiotów. Zaczynamy od matematyki — kolejne przedmioty będą dochodzić z czasem.</p>
  </div>

  <div class="progress-card" id="progressCard" hidden>
    <div class="progress-head">
      <div class="progress-ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle class="track" cx="32" cy="32" r="27"></circle>
          <circle class="fill" id="progressRingFill" cx="32" cy="32" r="27" stroke-dasharray="169.6" stroke-dashoffset="169.6"></circle>
        </svg>
        <div class="pct" id="progressPct">0%</div>
      </div>
      <div>
        <div class="progress-title">Twój postęp</div>
        <div class="progress-sub" id="progressSub">0 / 0 pkt</div>
      </div>
    </div>
    <div class="progress-rows" id="progressRows"></div>
  </div>

  <div class="subject-grid" id="subjectGrid"></div>

  <p class="footnote">Strona rośnie sukcesywnie — nowe przedmioty pojawią się tutaj, gdy będą gotowe.</p>
</div>

<script>
(function(){
  var subjects = [
    { icon:'&#128209;', title:'Matematyka', desc:'Liczby naturalne, figury geometryczne, ułamki zwykłe', href:'../matematyka/', ready:true },
    { icon:'&#128214;', title:'Język polski', desc:'Gramatyka, ortografia, lektury', href:'../jezyk-polski/', ready:true },
    { icon:'&#127793;', title:'Biologia', desc:'Świat roślin, zwierząt i zjawisk przyrody', href:'../biologia/', ready:true },
    { icon:'&#127963;&#65039;', title:'Historia', desc:'Dawne dzieje i wydarzenia', href:'../historia/', ready:true },
    { icon:'&#127758;', title:'Geografia', desc:'Mapy, krajobrazy i zjawiska przyrodnicze', href:null, ready:false },
    { icon:'&#127468;&#127463;', title:'Język angielski', desc:'Słownictwo i gramatyka', href:null, ready:false },
    { icon:'&#128187;', title:'Informatyka', desc:'Podstawy programowania i pracy z komputerem', href:null, ready:false },
    { icon:'&#128296;', title:'Technika', desc:'Rysunek techniczny i prace praktyczne', href:null, ready:false },
    { icon:'&#127912;', title:'Plastyka', desc:'Historia sztuki i techniki plastyczne', href:null, ready:false },
    { icon:'&#127925;', title:'Muzyka', desc:'Zapis nutowy i historia muzyki', href:null, ready:false }
  ];
  var grid = document.getElementById('subjectGrid');
  grid.innerHTML = subjects.map(function(s){
    var tag = s.ready ? 'a' : 'div';
    var hrefAttr = s.ready ? ' href="'+s.href+'"' : '';
    var cls = 'subject' + (s.ready ? ' ready' : ' disabled');
    return '<'+tag+' class="'+cls+'"'+hrefAttr+'>'+
      '<span class="s-icon">'+s.icon+'</span>'+
      '<span class="s-body"><span class="s-title">'+s.title+'</span><span class="s-desc">'+s.desc+'</span></span>'+
      '<span class="s-badge '+(s.ready?'ready':'soon')+'">'+(s.ready?'gotowe':'wkrótce')+'</span>'+
    '</'+tag+'>';
  }).join('');

  /* ---- progress dashboard ---- */
  /* Update this list whenever a new topic (with a test) is added anywhere in Nauka. */
  var PROGRESS_MANIFEST = [
    { subject:'Matematyka', icon:'&#128209;', key:'dzial_pam_best_v1', levels:['addsub','mult'] },
    { subject:'Matematyka', icon:'&#128209;', key:'pot_best_v1', levels:['squares','ten','mixed','order'] },
    { subject:'Matematyka', icon:'&#128209;', key:'kolej_best_v1', levels:['noparen','paren'] },
    { subject:'Matematyka', icon:'&#128209;', key:'rzym_best_v1', levels:['basic','big'] },
    { subject:'Matematyka', icon:'&#128209;', key:'przybl_best_v1', levels:['round','estimate'] },
    { subject:'Matematyka', icon:'&#128209;', key:'pierwsze_best_v1', levels:['easy','hard'] },
    { subject:'Matematyka', icon:'&#128209;', key:'rownania_best_v1', levels:['addsub','muldiv'] },
    { subject:'Matematyka', icon:'&#128209;', key:'powtorka_kartkowka_best_v1', levels:null, max:15 },
    { subject:'Historia', icon:'&#127963;&#65039;', key:'hist_zycie_pierwszych_ludzi_best_v1', levels:null },
    { subject:'Historia', icon:'&#127963;&#65039;', key:'hist_mezopotamia_best_v1', levels:null },
    { subject:'Historia', icon:'&#127963;&#65039;', key:'hist_egipt_faraonow_best_v1', levels:null },
    { subject:'Biologia', icon:'&#127793;', key:'bio_skladniki_chemiczne_best_v1', levels:null },
    { subject:'Biologia', icon:'&#127793;', key:'bio_komorka_zwierzeca_best_v1', levels:null },
    { subject:'Biologia', icon:'&#127793;', key:'bio_komorka_roslinna_best_v1', levels:null },
    { subject:'Biologia', icon:'&#127793;', key:'bio_grzyby_porosty_best_v1', levels:null },
    { subject:'Język polski', icon:'&#128214;', key:'polski_odmiana_rzeczownika_best_v1', levels:null }
  ];
  function loadJSON(k,f){ try{ var v=localStorage.getItem(k); return v!==null?JSON.parse(v):f; }catch(e){ return f; } }
  function computeProgress(){
    var bySubject = {};
    var totalEarned = 0, totalMax = 0;
    PROGRESS_MANIFEST.forEach(function(entry){
      var max = entry.max || ((entry.levels ? entry.levels.length : 1) * 10);
      var earned = 0;
      if (entry.levels){
        var obj = loadJSON(entry.key, {});
        entry.levels.forEach(function(lv){ earned += (obj[lv] || 0); });
      } else {
        earned = loadJSON(entry.key, 0) || 0;
      }
      earned = Math.min(earned, max);
      if (!bySubject[entry.subject]) bySubject[entry.subject] = { icon: entry.icon, earned:0, max:0 };
      bySubject[entry.subject].earned += earned;
      bySubject[entry.subject].max += max;
      totalEarned += earned; totalMax += max;
    });
    return { totalEarned:totalEarned, totalMax:totalMax, bySubject:bySubject };
  }
  (function renderProgress(){
    var p = computeProgress();
    if (p.totalEarned <= 0) return; // hide until the kid has actually played something
    var card = document.getElementById('progressCard');
    card.hidden = false;
    var pct = p.totalMax ? Math.round((p.totalEarned/p.totalMax)*100) : 0;
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressSub').textContent = p.totalEarned + ' / ' + p.totalMax + ' pkt';
    var circumference = 169.6;
    document.getElementById('progressRingFill').style.strokeDashoffset = String(circumference * (1 - pct/100));
    var rowsEl = document.getElementById('progressRows');
    rowsEl.innerHTML = Object.keys(p.bySubject).map(function(name){
      var s = p.bySubject[name];
      var spct = s.max ? Math.round((s.earned/s.max)*100) : 0;
      return '<div class="progress-row">'+
        '<span class="pr-icon">'+s.icon+'</span>'+
        '<span class="pr-name">'+name+'</span>'+
        '<span class="pr-bar"><span class="pr-fill" style="width:'+spct+'%"></span></span>'+
        '<span class="pr-val">'+s.earned+'/'+s.max+'</span>'+
      '</div>';
    }).join('');
  })();
})();
</script>
