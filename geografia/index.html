<style>
  :root{
    --paper:#f4faf9; --paper-2:#e9f3f2; --grid-line: rgba(43,122,148,0.09);
    --ink:#1a2a2c; --ink-soft:#5c7377; --card:#ffffff; --card-edge: rgba(26,42,44,0.11);
    --accent:#2b7a94; --accent-ink:#ffffff; --accent-soft:#dcedf1;
    --good:#2f9e6e; --good-soft:#e1f5ec;
    --sans: -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#111c1e; --paper-2:#162325; --grid-line: rgba(140,200,215,0.09);
      --ink:#e6f2f3; --ink-soft:#93aaad; --card:#182527; --card-edge: rgba(255,255,255,0.08);
      --accent:#5db6ce; --accent-ink:#08181c; --accent-soft:#1e363b;
      --good:#4fc98d; --good-soft:#173226;
    }
  }
  :root[data-theme="dark"]{
    --paper:#111c1e; --paper-2:#162325; --grid-line: rgba(140,200,215,0.09);
    --ink:#e6f2f3; --ink-soft:#93aaad; --card:#182527; --card-edge: rgba(255,255,255,0.08);
    --accent:#5db6ce; --accent-ink:#08181c; --accent-soft:#1e363b;
    --good:#4fc98d; --good-soft:#173226;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/32px 32px, linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/32px 32px, var(--paper);
    color:var(--ink); font-family:var(--sans); min-height:100vh;
  }
  .top-nav{ display:flex; margin-bottom:4px; max-width:680px; margin-left:auto; margin-right:auto; padding-top:28px; }
  .top-nav a{ display:inline-flex; align-items:center; gap:5px; color:var(--ink-soft); text-decoration:none; font-size:12.5px; font-weight:600; padding:6px 18px; }
  .wrap{ max-width:680px; margin:0 auto; padding:2px 16px 60px; }
  .hero{ text-align:center; padding: 10px 0 30px; }
  .hero .eyebrow{ font-family:var(--mono); font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .hero h1{ font-size:clamp(26px,7vw,34px); margin:8px 0 8px; font-weight:800; text-wrap:balance; }
  .hero p{ color:var(--ink-soft); font-size:14.5px; max-width:44ch; margin:0 auto; line-height:1.55; }

  .chapter{ margin-bottom:28px; }
  .chapter__head{ display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .chapter__badge{ width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-family:var(--mono); font-size:16px; color:#fff; background:var(--accent); flex-shrink:0; }
  .chapter__title{ font-size:18px; font-weight:800; }

  .topic-list{ display:flex; flex-direction:column; gap:7px; }
  .topic{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--card-edge); border-radius:10px; padding:11px 14px; text-decoration:none; color:var(--ink); }
  a.topic:active{ transform:scale(0.99); }
  .topic .idx{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); width:20px; flex-shrink:0; }
  .topic .t{ flex:1; font-size:14px; font-weight:600; }
  .topic .pg{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); flex-shrink:0; }
  .topic .badge{ font-family:var(--mono); font-size:10px; font-weight:700; padding:3px 8px; border-radius:6px; flex-shrink:0; letter-spacing:.02em; }
  .topic .badge.ready{ background:var(--good-soft); color:var(--good); }

  .progress-note{ text-align:center; font-size:12.5px; color:var(--ink-soft); margin: 30px 0 0; line-height:1.6; }
</style>

<div class="wrap">
  <div class="hero">
    <div class="eyebrow">Klasa 5</div>
    <h1>Geografia — nauka i testy</h1>
    <p>Mapy, krajobrazy Polski i świata — na podstawie podręcznika „Planeta Nowa 5”.</p>
  </div>

  <div class="chapter">
    <div class="chapter__head"><span class="chapter__badge">1</span><span class="chapter__title">Mapa Polski</span></div>
    <div class="topic-list" id="ch1"></div>
  </div>

  <p class="progress-note">Kolejne rozdziały (Krajobrazy Polski, Lądy i oceany, Krajobrazy świata) będą się tu pojawiać.</p>
</div>

<script>
(function(){
  var chapters = {
    ch1: [
      {t:'Mapa i skala', pg:8, href:'mapa-i-skala/', ready:true},
      {t:'Odległości na mapie i w terenie', pg:11, href:null, ready:false},
      {t:'Ukształtowanie powierzchni na mapach', pg:15, href:null, ready:false},
      {t:'Czytamy mapę najbliższej okolicy', pg:21, href:null, ready:false}
    ]
  };
  Object.keys(chapters).forEach(function(id){
    var el = document.getElementById(id);
    if (!el) return;
    el.innerHTML = chapters[id].map(function(item, i){
      var badge = item.ready ? '<span class="badge ready">gotowe</span>' : '';
      var pgLabel = item.pg ? ('str. '+item.pg) : '';
      if (item.ready){
        return '<a class="topic" href="'+item.href+'">'+
          '<span class="idx">'+(i+1)+'.</span>'+
          '<span class="t">'+item.t+'</span>'+
          '<span class="pg">'+pgLabel+'</span>'+
          badge+
        '</a>';
      }
      return '<div class="topic" style="opacity:.55;">'+
        '<span class="idx">'+(i+1)+'.</span>'+
        '<span class="t">'+item.t+'</span>'+
        '<span class="pg">'+pgLabel+'</span>'+
      '</div>';
    }).join('');
  });
})();
</script>
